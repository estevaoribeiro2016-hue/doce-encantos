<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Central da Empresa</title><link rel="stylesheet" href="/assets/style.css"></head><body>
<div id="login" class="loginWrap"><div class="loginCard"><div class="brand"><img src="/assets/mascote.png"><span>Central Doce Encanto</span></div><p>Acesso restrito. Informe usuário e senha.</p><input id="user" class="input" placeholder="Usuário" autocomplete="username"><input id="pass" class="input" placeholder="Senha" type="password" autocomplete="current-password"><button class="btn" onclick="login()">Entrar</button><button class="btn ghost" style="width:100%;margin-top:10px" onclick="faceId()">Usar Face ID / Windows Hello</button><p id="msg" style="color:#c03;font-weight:800"></p></div></div>
<div id="panel" class="panel" style="display:none"><aside class="side"><div class="brand"><img src="/assets/mascote.png"><span>Empresa</span></div><p style="opacity:.75">Central administrativa</p><button class="btn ghost" onclick="logout()">Sair</button></aside><main class="main"><h1 class="title">Demandas em tempo real</h1><div class="dashGrid"><div class="stat"><b>Pedidos</b><h2 id="nPedidos">0</h2></div><div class="stat"><b>Receita</b><h2 id="receita">R$ 0,00</h2></div><div class="stat"><b>Novos</b><h2 id="novos">0</h2></div></div><h2>Pedidos</h2><div id="orders"></div></main></div>
<script>
const allowed={'teteu.trufa':'30707420','ingrid.trufa':'30707420'};
function login(){const u=document.getElementById('user').value.trim();const p=document.getElementById('pass').value.trim();if(allowed[u]===p){sessionStorage.setItem('de_admin','ok');showPanel()}else document.getElementById('msg').textContent='Usuário ou senha incorretos.'}
async function faceId(){try{if(!window.PublicKeyCredential)throw new Error(); alert('Confirme sua identidade no dispositivo. Depois informe a senha na primeira entrada.');}catch(e){alert('Face ID/Windows Hello não disponível neste navegador. Use usuário e senha.')}}
function logout(){sessionStorage.removeItem('de_admin');location.reload()}
function showPanel(){document.getElementById('login').style.display='none';document.getElementById('panel').style.display='grid';render()}
function render(){const orders=JSON.parse(localStorage.getItem('de_orders')||'[]');document.getElementById('nPedidos').textContent=orders.length;document.getElementById('novos').textContent=orders.filter(o=>o.status==='Recebido').length;document.getElementById('receita').textContent='R$ '+orders.reduce((s,o)=>s+o.total,0).toFixed(2).replace('.',',');document.getElementById('orders').innerHTML=orders.length?orders.map((o,idx)=>`<div class='order'><h2>${o.id}</h2><p>${o.created}</p><p>${o.items.map(i=>`${i.qty}x ${i.name}`).join('<br>')}</p><p><b>Total:</b> R$ ${o.total.toFixed(2).replace('.',',')}</p><select onchange='status(${idx},this.value)' class='input'><option ${o.status==='Recebido'?'selected':''}>Recebido</option><option ${o.status==='Produção'?'selected':''}>Produção</option><option ${o.status==='Pronto'?'selected':''}>Pronto</option><option ${o.status==='Entregue'?'selected':''}>Entregue</option></select></div>`).join(''):'<div class="promoBox">Nenhum pedido ainda.</div>'}
function status(i,v){const orders=JSON.parse(localStorage.getItem('de_orders')||'[]');orders[i].status=v;localStorage.setItem('de_orders',JSON.stringify(orders));render()}
if(sessionStorage.getItem('de_admin')==='ok')showPanel(); setInterval(()=>{if(sessionStorage.getItem('de_admin')==='ok')render()},3000);
</script></body></html>
