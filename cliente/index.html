<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meu Pedido</title><link rel="stylesheet" href="/assets/style.css"></head><body><header class="top"><div class="nav"><a class="brand" href="/"><img src="/assets/mascote.png">Doce Encanto</a><a class="btn ghost" href="/">Voltar</a></div></header><main class="section"><h1 class="title">Meu pedido</h1><div id="orders"></div></main><script>const orders=JSON.parse(localStorage.getItem('de_orders')||'[]');document.getElementById('orders').innerHTML=orders.length?orders.map(o=>`<div class='order'><h2>${o.id}</h2><p>${o.created}</p><p><b>Status:</b> ${o.status}</p><p><b>Total:</b> R$ ${o.total.toFixed(2).replace('.',',')}</p></div>`).join(''):'<div class="promoBox">Nenhum pedido encontrado neste aparelho.</div>'</script></body></html>
